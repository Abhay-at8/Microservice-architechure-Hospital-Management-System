spring.application.name=pharmacy-service
server.port=8085

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
#spring.main.web-application-type=reactive


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/pharmacy
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.show-sql = true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect



#spring.kafka.producer.bootstrap-servers: ${KAFKA_HOST:ec2-13-201-76-213.ap-south-1.compute.amazonaws.com}:9092
# spring.kafka.producer.bootstrap-servers: 172.28.251.163:9092
spring.kafka.producer.key-serializer: org.apache.kafka.common.serialization.StringSerializer
# spring.kafka.producer.value-serializer: org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.topic.name=orders

spring.kafka.topic-consume.name=diagnosis

spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:9092
#spring.kafka.consumer.bootstrap-servers: ${KAFKA_HOST:ec2-13-201-76-213.ap-south-1.compute.amazonaws.com}:9092
spring.kafka.consumer.group-id: pharmacyGroup
spring.kafka.consumer.auto-offset-reset: earliest
spring.kafka.consumer.key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
#spring.kafka.consumer.value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*