---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: abhayat8/gateway
          env:
            - name: EUREKA_HOST
              value: eureka-service
            - name: DOC_SERVICE
              value: doctor-service
            - name: AUTH_SERVICE
              value: auth-service
            - name: PHARMACY_SERVICE
              value: pharmacy-service
            - name: APPOINTMENT_SERVICE
              value: appointment-service
            - name: PATIENT_SERVICE
              value: patient-service
            - name: ML_SERVICE
              value: ml-service
            - name: GATEWAY_HOST
              value: api-gateway
            - name: SPARKS_SERVICE
              value: spark-report-service
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
  type: LoadBalancer

