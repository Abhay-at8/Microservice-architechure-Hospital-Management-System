spring.application.name=appointment-service
server.port=8083

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
#spring.main.web-application-type=reactive


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/appointment
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.show-sql = true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect

#spring.kafka.bootstrap-servers=ec2-13-201-76-213.ap-south-1.compute.amazonaws.com:9092
#spring.kafka.bootstrap-servers=${KAFKA_HOST:ec2-65-2-6-41.ap-south-1.compute.amazonaws.com}:9092
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:9092
#spring.kafka.producer.bootstrap-servers: ${KAFKA_HOST:localhost}:9092
spring.kafka.producer.key-serializer: org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.topic.name=diagnosis

